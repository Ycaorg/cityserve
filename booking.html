<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Book a Service | CityServe</title>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
    }

    .nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 15px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 45px auto;
      padding: 0 18px;
    }

    .booking-card {
      width: 100%;
      max-width: 100%;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #111827;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
      width: 100%;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
      font-family: Arial, sans-serif;
      background: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #111827;
    }

    .date-time-row {
      display: flex;
      width: 100%;
      max-width: 100%;
      gap: 15px;
      min-width: 0;
    }

    .date-time-row .form-group {
      flex: 1 1 0;
      width: 0;
      min-width: 0;
    }

    input[type="date"],
    input[type="time"] {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      height: 48px;
      padding: 10px;
      box-sizing: border-box;
      appearance: none;
      -webkit-appearance: none;
    }

    button {
      width: 100%;
      border: none;
      background: #111827;
      color: white;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      display: none;
      line-height: 1.5;
      word-break: break-word;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .warning {
      display: block !important;
      background: #fef3c7;
      color: #92400e;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    .error pre {
      margin-top: 10px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 7px;
      overflow-x: auto;
      font-size: 13px;
      color: #7f1d1d;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 600px) {

      .nav {
        flex-direction: column;
        gap: 12px;
      }

      .nav a {
        margin: 0 7px;
        font-size: 13px;
      }

      .container {
        margin: 25px auto;
        padding: 0 12px;
      }

      .booking-card {
        padding: 22px 17px;
        border-radius: 15px;
      }

      .date-time-row {
        display: block;
        width: 100%;
      }

      .date-time-row .form-group {
        display: block;
        width: 100%;
        min-width: 0;
      }

      input[type="date"],
      input[type="time"] {
        width: 100%;
        max-width: 100%;
        height: 48px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="nav">

    <div class="logo">
      CityServe
    </div>

    <div>
      <a href="index.html">Home</a>
      <a href="index.html#services">Services</a>
    </div>

  </div>
</header>


<div class="container">

  <div class="booking-card">

    <h1>Book a Service</h1>

    <p class="subtitle">
      Fill out the form below and CityServe will receive your request.
    </p>


    <form id="bookingForm">


      <div class="form-group">

        <label for="customer_name">
          Full Name
        </label>

        <input
          type="text"
          id="customer_name"
          required
          placeholder="Enter your full name"
        >

      </div>


      <div class="form-group">

        <label for="customer_email">
          Email Address
        </label>

        <input
          type="email"
          id="customer_email"
          required
          placeholder="you@example.com"
        >

      </div>


      <div class="form-group">

        <label for="customer_phone">
          Phone Number
        </label>

        <input
          type="tel"
          id="customer_phone"
          required
          placeholder="09XXXXXXXXX"
        >

      </div>


      <div class="form-group">

        <label for="service">
          Choose a Service
        </label>

        <select id="service" required>

          <option value="">
            Select a service
          </option>

          <option>Cleaning</option>
          <option>Car Wash</option>
          <option>Pest Control</option>
          <option>Babysitting</option>
          <option>Chef Services</option>
          <option>Aircon Services</option>
          <option>Plumbing</option>
          <option>Electrical</option>
          <option>Carpentry</option>
          <option>Painting</option>
          <option>Website Development</option>
          <option>Graphic Design</option>
          <option>Social Media Management</option>
          <option>IT Services</option>
          <option>CCTV Installation</option>
          <option>Network Setup</option>

        </select>

      </div>


      <div class="date-time-row">

        <div class="form-group">

          <label for="booking_date">
            Preferred Date
          </label>

          <input
            type="date"
            id="booking_date"
            required
          >

        </div>


        <div class="form-group">

          <label for="booking_time">
            Preferred Time
          </label>

          <input
            type="time"
            id="booking_time"
            required
          >

        </div>

      </div>


      <div class="form-group">

        <label for="address">
          Service Address
        </label>

        <textarea
          id="address"
          required
          placeholder="Enter the address where the service is needed"
        ></textarea>

      </div>


      <div class="form-group">

        <label for="notes">
          Additional Notes
        </label>

        <textarea
          id="notes"
          placeholder="Anything the service provider should know?"
        ></textarea>

      </div>


      <button
        type="submit"
        id="submitButton"
      >
        Submit Booking
      </button>


    </form>


    <div id="message"></div>


  </div>

</div>


<footer>
  © 2026 CityServe. All rights reserved.
</footer>



<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
  "https://grjnaylbwlerrchskvty.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_wmIhQc8wobila7q4wD0BJA_N49tM78n";


/* ==========================================
   EMAILJS
========================================== */

const EMAILJS_PUBLIC_KEY =
  "8z1Hyfw7E3SRYhwyY";

const EMAILJS_SERVICE_ID =
  "service_7i14y1w";

const EMAILJS_TEMPLATE_ID =
  "template_afi020j";

const OWNER_EMAIL =
  "waynepadolina03@gmail.com";


/* ==========================================
   INITIALIZE EMAILJS
========================================== */

try {

  emailjs.init({
    publicKey: EMAILJS_PUBLIC_KEY
  });

  console.log(
    "CityServe: EmailJS initialized."
  );

} catch (error) {

  console.error(
    "EmailJS initialization error:",
    error
  );

}


/* ==========================================
   FORM ELEMENTS
========================================== */

const form =
  document.getElementById("bookingForm");

const message =
  document.getElementById("message");

const submitButton =
  document.getElementById("submitButton");


/* ==========================================
   SUBMIT BOOKING
========================================== */

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    message.className = "";
    message.style.display = "none";


    submitButton.disabled = true;

    submitButton.textContent =
      "Submitting...";


    /* ========================================
       GET BOOKING INFORMATION
    ======================================== */

    const booking = {

      customer_name:
        document
          .getElementById("customer_name")
          .value
          .trim(),

      customer_email:
        document
          .getElementById("customer_email")
          .value
          .trim(),

      customer_phone:
        document
          .getElementById("customer_phone")
          .value
          .trim(),

      service:
        document
          .getElementById("service")
          .value,

      booking_date:
        document
          .getElementById("booking_date")
          .value,

      booking_time:
        document
          .getElementById("booking_time")
          .value,

      address:
        document
          .getElementById("address")
          .value
          .trim(),

      notes:
        document
          .getElementById("notes")
          .value
          .trim()

    };


    try {


      /* ======================================
         SAVE BOOKING TO SUPABASE
      ====================================== */

      console.log(
        "CityServe: Saving booking..."
      );


      const supabaseResponse =
        await fetch(

          SUPABASE_URL +
          "/rest/v1/bookings",

          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_KEY,

              "Prefer":
                "return=minimal"

            },

            body:
              JSON.stringify(booking)

          }

        );


      if (!supabaseResponse.ok) {

        const supabaseError =
          await supabaseResponse.text();

        console.error(
          "Supabase error:",
          supabaseError
        );

        throw new Error(
          "Supabase error: " +
          supabaseError
        );

      }


      console.log(
        "CityServe: Booking saved."
      );


      /* ======================================
         CHECK EMAILJS SDK
      ====================================== */

      if (
        typeof emailjs ===
        "undefined"
      ) {

        throw new Error(
          "EmailJS SDK did not load."
        );

      }


      /* ======================================
         SEND EMAILJS NOTIFICATION
      ====================================== */

      console.log(
        "CityServe: Sending owner notification..."
      );


      const emailResponse =
        await emailjs.send(

          EMAILJS_SERVICE_ID,

          EMAILJS_TEMPLATE_ID,

          {

            owner_name:
              "CityServe Service Owner",

            owner_email:
              OWNER_EMAIL,

            customer_name:
              booking.customer_name,

            customer_email:
              booking.customer_email,

            customer_phone:
              booking.customer_phone,

            service:
              booking.service,

            booking_date:
              booking.booking_date,

            booking_time:
              booking.booking_time,

            address:
              booking.address,

            notes:
              booking.notes

          }

        );


      console.log(
        "EmailJS response:",
        emailResponse
      );


      /* ======================================
         SUCCESS
      ====================================== */

      message.className =
        "success";

      message.innerHTML =
        "✅ <strong>Booking submitted successfully!</strong><br><br>" +
        "Your booking has been saved and the service owner has been notified.";

      form.reset();


    } catch (error) {


      /* ======================================
         DISPLAY REAL ERROR
      ====================================== */

      console.error(
        "CityServe error:",
        error
      );


      let errorDetails = "";


      if (
        error &&
        typeof error === "object"
      ) {

        try {

          errorDetails =
            JSON.stringify(
              error,
              null,
              2
            );

        } catch (jsonError) {

          errorDetails =
            String(error);

        }

      } else {

        errorDetails =
          String(error);

      }


      message.className =
        "error";


      message.innerHTML =
        "⚠️ <strong>Booking was saved, but the owner notification failed.</strong>" +
        "<br><br>" +
        "<strong>EmailJS Error Details:</strong>" +
        "<pre>" +
        errorDetails +
        "</pre>";


    }


    submitButton.disabled =
      false;

    submitButton.textContent =
      "Submit Booking";

  }

);

</script>

</body>
</html>
