<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book a Service | CityServe</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7f5;
            color: #222;
        }

        header {
            background: #1f6f43;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }

        .container {
            max-width: 700px;
            margin: 45px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #1f6f43;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1f6f43;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            background: #dff5e5;
            color: #176b36;
        }

        .error {
            background: #ffe0e0;
            color: #a00000;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        @media (max-width: 600px) {
            header {
                padding: 15px;
            }

            nav a {
                margin-left: 8px;
                font-size: 13px;
            }

            .container {
                margin: 25px 15px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        CityServe
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#services">Services</a>
        <a href="booking.html">Book</a>
    </nav>

</header>


<div class="container">

    <h1>Book a Service</h1>

    <p class="subtitle">
        Fill out the form below to request a CityServe service.
    </p>

    <form id="bookingForm">

        <label for="name">Full Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
        >


        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label for="phone">Phone Number</label>

        <input
            type="tel"
            id="phone"
            placeholder="09XXXXXXXXX"
            required
        >


        <label for="service">Choose a Service</label>

        <select id="service" required>

            <option value="">
                Select a service
            </option>

            <option>Cleaning</option>
            <option>Car Wash</option>
            <option>Pest Control</option>
            <option>Babysitting</option>
            <option>Chef Services</option>
            <option>Aircon Services</option>
            <option>Plumbing</option>
            <option>Electrical</option>
            <option>Carpentry</option>
            <option>Painting</option>
            <option>Website Development</option>
            <option>Graphic Design</option>
            <option>Social Media Management</option>
            <option>IT Services</option>
            <option>CCTV Installation</option>
            <option>Network Setup</option>

        </select>


        <label for="date">
            Preferred Date
        </label>

        <input
            type="date"
            id="date"
            required
        >


        <label for="time">
            Preferred Time
        </label>

        <input
            type="time"
            id="time"
            required
        >


        <label for="address">
            Service Address
        </label>

        <textarea
            id="address"
            placeholder="Enter the service location"
            required
        ></textarea>


        <label for="notes">
            Additional Notes
        </label>

        <textarea
            id="notes"
            placeholder="Anything else we should know?"
        ></textarea>


        <button
            type="submit"
            id="submitButton"
        >
            Submit Booking
        </button>


        <div id="message"></div>

    </form>

</div>


<footer>
    © 2026 CityServe. All rights reserved.
</footer>


<script>

    // ==========================================
    // SUPABASE CONNECTION
    // ==========================================

    const SUPABASE_URL =
        "https://grjnaylbwlerrchskvty.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_wmIhQc8wobila7q4wD0BJA_N49tM78n";


    // ==========================================
    // FORM ELEMENTS
    // ==========================================

    const form =
        document.getElementById("bookingForm");

    const button =
        document.getElementById("submitButton");

    const message =
        document.getElementById("message");


    // ==========================================
    // SUBMIT BOOKING
    // ==========================================

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        button.disabled = true;

        button.textContent = "Submitting...";

        message.style.display = "none";


        const booking = {

            customer_name:
                document.getElementById("name").value.trim(),

            customer_email:
                document.getElementById("email").value.trim(),

            customer_phone:
                document.getElementById("phone").value.trim(),

            service:
                document.getElementById("service").value,

            booking_date:
                document.getElementById("date").value,

            booking_time:
                document.getElementById("time").value,

            address:
                document.getElementById("address").value.trim(),

            notes:
                document.getElementById("notes").value.trim()

        };


        try {

            const response = await fetch(
                SUPABASE_URL + "/rest/v1/bookings",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "apikey": SUPABASE_KEY,
                        "Authorization": "Bearer " + SUPABASE_KEY,
                        "Prefer": "return=minimal"
                    },

                    body: JSON.stringify(booking)
                }
            );


            if (!response.ok) {

                const errorText =
                    await response.text();

                console.error(
                    "Supabase error:",
                    errorText
                );

                throw new Error(
                    errorText
                );
            }


            // ==========================================
            // SUCCESS
            // ==========================================

            message.className =
                "success";

            message.textContent =
                "✓ Booking submitted successfully! CityServe will process your request.";

            message.style.display =
                "block";


            form.reset();

        }

        catch (error) {

            console.error(error);

            message.className =
                "error";

            message.textContent =
                "Booking failed. Please try again.";

            message.style.display =
                "block";

        }


        button.disabled = false;

        button.textContent =
            "Submit Booking";

    });

</script>

</body>
</html>
