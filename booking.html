<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Book a Service | CityServe</title>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111111;
    }

    header {
      background: #111111;
      color: white;
      padding: 18px 20px;
    }

    .nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      color: #ff7900;
    }

    .nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 15px;
      font-weight: bold;
    }

    .nav a:hover {
      color: #ff7900;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 45px auto;
      padding: 0 18px;
    }

    .booking-card {
      width: 100%;
      max-width: 100%;
      background: white;
      padding: 30px;
      border-radius: 18px;
      border-top: 7px solid #ff7900;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #111111;
    }

    .subtitle {
      text-align: center;
      color: #666666;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
      width: 100%;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      padding: 13px;
      border: 1px solid #cccccc;
      border-radius: 9px;
      font-size: 15px;
      font-family: Arial, sans-serif;
      background: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border: 2px solid #ff7900;
    }

    .date-time-row {
      display: flex;
      width: 100%;
      max-width: 100%;
      gap: 15px;
      min-width: 0;
    }

    .date-time-row .form-group {
      flex: 1 1 0;
      width: 0;
      min-width: 0;
    }

    input[type="date"],
    input[type="time"] {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      height: 48px;
      padding: 10px;
      box-sizing: border-box;
      appearance: none;
      -webkit-appearance: none;
    }

    button {
      width: 100%;
      border: none;
      background: #ff7900;
      color: #111111;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      background: #ff8c1a;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      display: none;
      line-height: 1.5;
      word-break: break-word;
    }

    .success {
      display: block !important;
      background: #fff0e0;
      color: #9a4300;
      border: 1px solid #ff7900;
    }

    .error {
      display: block !important;
      background: #f3f3f3;
      color: #111111;
      border: 2px solid #111111;
    }

    .error pre {
      margin-top: 10px;
      padding: 10px;
      background: white;
      border-radius: 7px;
      overflow-x: auto;
      font-size: 13px;
      color: #111111;
    }

    footer {
      background: #111111;
      text-align: center;
      padding: 30px 15px;
      color: #aaaaaa;
      font-size: 14px;
    }

    footer strong {
      color: #ff7900;
    }

    @media (max-width: 600px) {

      .nav {
        flex-direction: column;
        gap: 12px;
      }

      .nav a {
        margin: 0 7px;
        font-size: 13px;
      }

      .container {
        margin: 25px auto;
        padding: 0 12px;
      }

      .booking-card {
        padding: 22px 17px;
        border-radius: 15px;
      }

      .date-time-row {
        display: block;
        width: 100%;
      }

      .date-time-row .form-group {
        display: block;
        width: 100%;
        min-width: 0;
      }

      input[type="date"],
      input[type="time"] {
        width: 100%;
        max-width: 100%;
        height: 48px;
      }
    }

  </style>
</head>


<body>


<header>

  <div class="nav">

    <div class="logo">
      CityServe
    </div>

    <div>

      <a href="index.html">
        Home
      </a>

      <a href="index.html#services">
        Services
      </a>

    </div>

  </div>

</header>



<div class="container">

  <div class="booking-card">

    <h1>
      Book a Service
    </h1>

    <p class="subtitle">
      Fill out the form below and CityServe will receive your request.
    </p>


    <form id="bookingForm">


      <div class="form-group">

        <label for="customer_name">
          Full Name
        </label>

        <input
          type="text"
          id="customer_name"
          required
          placeholder="Enter your full name"
        >

      </div>


      <div class="form-group">

        <label for="customer_email">
          Email Address
        </label>

        <input
          type="email"
          id="customer_email"
          required
          placeholder="you@example.com"
        >

      </div>


      <div class="form-group">

        <label for="customer_phone">
          Phone Number
        </label>

        <input
          type="tel"
          id="customer_phone"
          required
          placeholder="09XXXXXXXXX"
        >

      </div>


      <div class="form-group">

        <label for="service">
          Choose a Service
        </label>

        <select id="service" required>

          <option value="">
            Select a service
          </option>

          <option>Home Cleaning - ₱1,200</option>
          <option>Deep Cleaning - ₱3,500</option>
          <option>Air Conditioner Cleaning - ₱700 per unit</option>
          <option>Pest Control - ₱2,000</option>
          <option>Car Interior Detailing - ₱2,500</option>
          <option>Plumbing Repair - ₱800 onwards</option>
          <option>Electrical Repair - ₱800 onwards</option>
          <option>Website Development - ₱15,000 onwards</option>
          <option>Social Media Management - ₱8,000/month</option>

          <option>Babysitting - Contact for pricing</option>
          <option>Chef Services - Contact for pricing</option>
          <option>Carpentry - Contact for pricing</option>
          <option>Painting - Contact for pricing</option>
          <option>Graphic Design - Contact for pricing</option>
          <option>IT Services - Contact for pricing</option>
          <option>CCTV Installation - Contact for pricing</option>
          <option>Network Setup - Contact for pricing</option>

        </select>

      </div>


      <div class="date-time-row">

        <div class="form-group">

          <label for="booking_date">
            Preferred Date
          </label>

          <input
            type="date"
            id="booking_date"
            required
          >

        </div>


        <div class="form-group">

          <label for="booking_time">
            Preferred Time
          </label>

          <input
            type="time"
            id="booking_time"
            required
          >

        </div>

      </div>


      <div class="form-group">

        <label for="address">
          Service Address
        </label>

        <textarea
          id="address"
          required
          placeholder="Enter the address where the service is needed"
        ></textarea>

      </div>


      <div class="form-group">

        <label for="notes">
          Additional Notes
        </label>

        <textarea
          id="notes"
          placeholder="Anything the service provider should know?"
        ></textarea>

      </div>


      <button
        type="submit"
        id="submitButton"
      >
        Submit Booking
      </button>


    </form>


    <div id="message"></div>


  </div>

</div>



<footer>

  © 2026 <strong>CityServe Hub PH</strong>.
  All rights reserved.

</footer>



<script>


/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
  "https://grjnaylbwlerrchskvty.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_wmIhQc8wobila7q4wD0BJA_N49tM78n";


/* ==========================================
   EMAILJS
========================================== */

const EMAILJS_PUBLIC_KEY =
  "8z1Hyfw7E3SRYhwyY";

const EMAILJS_SERVICE_ID =
  "service_7i14y1w";

const EMAILJS_TEMPLATE_ID =
  "template_afi020j";

const OWNER_EMAIL =
  "waynepadolina03@gmail.com";


/* ==========================================
   INITIALIZE EMAILJS
========================================== */

emailjs.init({
  publicKey: EMAILJS_PUBLIC_KEY
});


/* ==========================================
   FORM
========================================== */

const form =
  document.getElementById("bookingForm");

const message =
  document.getElementById("message");

const submitButton =
  document.getElementById("submitButton");


form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    message.className = "";
    message.style.display = "none";

    submitButton.disabled = true;
    submitButton.textContent = "Submitting...";


    const booking = {

      customer_name:
        document
          .getElementById("customer_name")
          .value
          .trim(),

      customer_email:
        document
          .getElementById("customer_email")
          .value
          .trim(),

      customer_phone:
        document
          .getElementById("customer_phone")
          .value
          .trim(),

      service:
        document
          .getElementById("service")
          .value,

      booking_date:
        document
          .getElementById("booking_date")
          .value,

      booking_time:
        document
          .getElementById("booking_time")
          .value,

      address:
        document
          .getElementById("address")
          .value
          .trim(),

      notes:
        document
          .getElementById("notes")
          .value
          .trim()

    };


    try {


      /* ======================================
         SAVE TO SUPABASE
      ====================================== */

      const supabaseResponse =
        await fetch(

          SUPABASE_URL +
          "/rest/v1/bookings",

          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_KEY,

              "Prefer":
                "return=minimal"

            },

            body:
              JSON.stringify(booking)

          }

        );


      if (!supabaseResponse.ok) {

        const errorText =
          await supabaseResponse.text();

        throw new Error(
          "Supabase error: " +
          errorText
        );

      }


      /* ======================================
         SEND EMAILJS
      ====================================== */

      if (
        typeof emailjs ===
        "undefined"
      ) {

        throw new Error(
          "EmailJS SDK did not load."
        );

      }


      const emailResponse =
        await emailjs.send(

          EMAILJS_SERVICE_ID,

          EMAILJS_TEMPLATE_ID,

          {

            owner_name:
              "CityServe Service Owner",

            owner_email:
              OWNER_EMAIL,

            customer_name:
              booking.customer_name,

            customer_email:
              booking.customer_email,

            customer_phone:
              booking.customer_phone,

            service:
              booking.service,

            booking_date:
              booking.booking_date,

            booking_time:
              booking.booking_time,

            address:
              booking.address,

            notes:
              booking.notes

          }

        );


      console.log(
        "EmailJS SUCCESS:",
        emailResponse
      );


      /* ======================================
         SUCCESS
      ====================================== */

      message.className =
        "success";

      message.innerHTML =
        "✅ <strong>Booking submitted successfully!</strong><br><br>" +
        "Your booking has been saved and the service owner has been notified.";

      form.reset();


    } catch (error) {


      console.error(
        "CityServe Error:",
        error
      );


      let errorDetails = "";


      if (
        error &&
        typeof error === "object"
      ) {

        try {

          errorDetails =
            JSON.stringify(
              error,
              null,
              2
            );

        } catch (jsonError) {

          errorDetails =
            String(error);

        }

      } else {

        errorDetails =
          String(error);

      }


      message.className =
        "error";

      message.innerHTML =
        "⚠️ <strong>Booking was saved, but the owner notification failed.</strong>" +
        "<br><br>" +
        "<strong>EmailJS Error Details:</strong>" +
        "<pre>" +
        errorDetails +
        "</pre>";

    }


    submitButton.disabled =
      false;

    submitButton.textContent =
      "Submit Booking";

  }

);

</script>

</body>
</html>
